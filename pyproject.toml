[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netlab"
version = "0.1.0"
description = "Controlled TCP/UDP network performance experiments"
requires-python = ">=3.11"

[project.scripts]
netlab = "netlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
